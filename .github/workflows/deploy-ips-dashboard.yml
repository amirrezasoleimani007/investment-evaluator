name: Deploy IPS dashboard to GitHub Pages

# Deployment trigger: IPS dashboard version 24
on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/deploy-ips-dashboard.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ips-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ready static dashboard
        uses: actions/checkout@v4
        with:
          ref: ips-dashboard
          path: site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload ready site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
