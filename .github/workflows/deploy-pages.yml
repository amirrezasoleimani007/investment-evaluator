name: Deploy IPS dashboard to GitHub Pages

on:
  push:
    branches:
      - ips-dashboard
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout dashboard
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Enable and configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Install exact dependencies
        run: npm ci

      - name: Build dashboard for repository path
        run: npm run build:pages

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-pages

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish site
        id: deployment
        uses: actions/deploy-pages@v4
